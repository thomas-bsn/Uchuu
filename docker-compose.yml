x-image: &image ${UCHUU_IMAGE:-ghcr.io/thomas-bsn/uchuu:latest}

services:
  # Tâche unique, lancée à chaque `docker compose up` avant le bot : récupère la dernière image
  # publiée par la CI. Si elle a changé, `bot` est recréé avec (compose compare l'image du
  # conteneur à l'image locale quand il converge le service). Hors ligne ou registre injoignable :
  # on garde l'image déjà présente et le bot démarre quand même.
  # Monte le socket Docker (accès root à l'hôte) : image `docker:cli` officielle, rien d autre dedans.
  migrate:
    image: docker:27-cli
    command: ["sh", "-c", "docker pull \"$$UCHUU_IMAGE\" || echo 'pull impossible : image locale conservée'"]
    environment:
      UCHUU_IMAGE: *image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"

  bot:
    image: *image
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Secrets / IDs fournis par l'environnement de déploiement, jamais dans l'image
    env_file:
      - .env
    environment:
      INTERNAL_API_HOST: 0.0.0.0
      INTERNAL_API_PORT: 9000
      SHAMELESS_DB_PATH: /data/shameless.sqlite3
      # le reverse proxy joint le conteneur via le bridge Docker
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      # dédup webhooks + présences : DOIT survivre aux redéploiements
      - shameless-data:/data
    ports:
      # exposé uniquement en local, le reverse proxy HTTPS public relaie
      - "127.0.0.1:9000:9000"

volumes:
  shameless-data:
